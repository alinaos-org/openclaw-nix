name: release-watch

# Hourly: when openclaw/openclaw has a newer stable release than release.nix,
# pin it (release table, every runtime plugin at the release, pnpm dependency
# hash) and open a pull request. CI then builds and tests the candidate, every
# plugin included, on the pull request.
#
# A pinning step that fails still pushes the branch and opens a draft pull
# request named after the step, and the run fails: 2026.10.5's pnpm step failed
# on 2026-10-19 (a gateway source patch no longer applied) before anything was
# pushed, and nothing showed it for 15 hours.
#
# The session icon picker patch is the exception: when it no longer applies
# (2026.10.5 and 2026.10.10 rewrote what it edits), the release builds with
# OpenClaw's own picker (`sessionIconPicker = false;` in its releases.nix entry).
# Its pull request stays ready, labelled stock-icon-picker, and the re-port is an
# issue with the same label.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  # The stock-icon-picker label and the picker's re-port issue.
  issues: write
  pull-requests: write

# One run at a time: a slow pin must not race the next hour's run.
concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rebase below needs main's history, not a shallow clone.
          fetch-depth: 0
      # Without Nix, so the hourly run that finds nothing to do takes seconds.
      - name: Compare with the newest stable release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^ *current = "\([^"]*\)";.*/\1/p' release.nix)
          [ -n "$current" ] || { echo "no current release in release.nix" >&2; exit 1; }
          newest=$(gh api 'repos/openclaw/openclaw/releases?per_page=100' \
            | jq -c --arg current "$current" -f scripts/newest-stable.jq)
          echo "current=$current newest=$newest"
          [ -n "$newest" ] || { echo "no stable OpenClaw release in the listing" >&2; exit 1; }
          [ "$(jq -r .newer <<<"$newest")" = true ] || exit 0
          latest=$(jq -r .version <<<"$newest")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if gh pr list --state open --head "release-$latest" --json number --jq '.[0].number' | grep -q .; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "release-$latest" >/dev/null; then
            # Pushed, but its pull request was never opened (2026.10.3: Actions
            # could not create pull requests yet), so every later push failed.
            echo "orphan=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.latest.outputs.new == 'true'
        with:
          # The Nix version consumers build with, so derivations and the cache match.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Pin the release
        id: pin
        if: steps.latest.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          v=${{ steps.latest.outputs.latest }}
          # Each step in order; the first that fails is named in the pull request.
          step() {
            local name=$1; shift
            echo "::group::$name"
            if ! "$@"; then
              echo "::endgroup::"
              echo "::error::$name failed"
              echo "failed=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
          }
          locks() { scripts/generate-plugin-locks.sh "$v" | tee -a "$GITHUB_STEP_SUMMARY"; }
          options() { scripts/generate-config-options.sh "$v" | tee -a "$GITHUB_STEP_SUMMARY"; }
          picker() {
            python3 scripts/new-release.py "$v" --icon-picker-only | tee -a "$GITHUB_STEP_SUMMARY" || return
            echo "PICKER_CHECKED=yes" >> "$GITHUB_ENV"
          }
          plugins() {
            local rc=0
            python3 scripts/pin-runtime-plugins.py "$v" || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || return "$rc"
            echo "PLUGIN_DEPS_CHANGED=$([ "$rc" -eq 2 ] && echo yes || echo no)" >> "$GITHUB_ENV"
          }
          step "the release table entry" python3 scripts/new-release.py "$v" --skip-pnpm
          # Sets `sessionIconPicker = false;` when the picker patch no longer
          # applies; fails only when the check itself does.
          step "the session icon picker check" picker
          # The CLI tools at their latest releases, qualified with this release.
          step "the CLI tools update" nix flake update nix-openclaw-tools
          # Every plugin OpenClaw's catalogs list, at this release.
          step "the runtime plugin locks" locks
          # The typed config options from this release's schema.
          step "the typed config options" options
          # Then the few pinned by hand outside the catalogs.
          step "the hand-pinned plugins" plugins
          step "the pnpm dependency hash" python3 scripts/new-release.py "$v" --pnpm-only
      - name: Open the pull request
        if: steps.latest.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.pin.outputs.failed }}
        run: |
          v=${{ steps.latest.outputs.latest }}
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release-$v"
          git add -A release.nix releases.nix pins flake.lock
          git commit --allow-empty -m "openclaw: $v"
          git push origin "release-$v"
          note=""
          [ "$PLUGIN_DEPS_CHANGED" = yes ] && note=$'\n\nA runtime plugin changed its dependencies: check that it still builds.'
          # The picker check's verdict as the branch evaluates it: true, false,
          # or unknown when pinning failed before the check ran.
          picker=unknown
          if [ "$PICKER_CHECKED" = yes ]; then
            picker=$(nix eval --json --accept-flake-config .#gateway.passthru.sessionIconPicker || echo unknown)
          fi
          # The re-port issue: comment on the open one, or open it. Prints its
          # reference; a failure only warns, and the pull request still opens.
          reissue() {
            local issue url
            issue=$(gh issue list --state open --label stock-icon-picker --json number --jq '.[0].number // empty') || return
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "OpenClaw $v builds with the stock session icon picker too ($run). Re-port on its release." >/dev/null || return
              echo "#$issue"
              return
            fi
            url=$(gh issue create --label stock-icon-picker --title "Re-port the session icon picker (OpenClaw $v)" --body-file - <<BODY
          openclaw-nix's session icon picker patch (\`packages/gateway/patches/session-icon-picker.patch\`) does not apply to OpenClaw $v; release-watch's session icon picker check shows what failed ($run). The release builds with OpenClaw's own picker (\`sessionIconPicker = false;\` in its \`releases.nix\` entry). Sessions keep their saved icons and still show them.

          - [ ] Re-port the hook in a scratch repository of the release source (\`nix build .#gateway.passthru.upstreamSource\`) and regenerate the patch with \`git diff\`.
          - [ ] Keep the previous patch as \`patches/<previous release>/session-icon-picker.patch\`, chosen with \`lib.versionOlder\` in \`packages/gateway/default.nix\`.
          - [ ] Delete \`sessionIconPicker = false;\` and its comment from the release's entry (\`scripts/new-release.py <release> --icon-picker-only\` says when the patch applies again).
          - [ ] The build's Control UI tests pass (CI \`build\`), \`ownUiTestExclusions\` included.
          - [ ] After the merge, dispatch \`tag-release\` for the fix release (\`<release>-r2\` or later).
          BODY
            ) || return
            echo "#${url##*/}"
          }
          labels=()
          issue=""
          suffix=${FAILED:+pinning failed at $FAILED}
          if [ "$picker" = false ]; then
            gh label create stock-icon-picker --color fbca04 --force \
              --description "Builds with OpenClaw's own session icon picker; openclaw-nix's patch needs a re-port" \
              && labels=(--label stock-icon-picker)
            issue=$(reissue) || issue=""
            [ -n "$issue" ] || echo "::warning::could not open or update the session icon picker re-port issue"
            suffix="${suffix:+$suffix; }stock session icon picker"
            note="$note"$'\n\n'"The session icon picker patch does not apply to $v, so this release builds with OpenClaw's own picker (\`sessionIconPicker = false;\` in releases.nix). Sessions keep their saved icons and still show them; openclaw-nix's emoji catalog and icon library come back with the re-port${issue:+ ($issue)}."
          elif [ "$picker" = true ]; then
            note="$note"$'\n\n'"The session icon picker patch applies. If it no longer compiles or its tests fail, add \`sessionIconPicker = false;\` to the release's releases.nix entry here: the release then builds with OpenClaw's own picker."
          fi
          title="openclaw: $v${suffix:+ ($suffix)}"
          if [ -n "$FAILED" ]; then
            gh pr create --draft "${labels[@]}" --title "$title" \
              --body "release-watch could not finish pinning OpenClaw $v: $FAILED failed ($run). This branch has the steps before it. Fix it here (re-port or drop a patch, rerun the step), then mark the pull request ready.$note"
          else
            gh pr create "${labels[@]}" --title "$title" --body "Pins OpenClaw $v (release table, every runtime plugin at the release, pnpm dependency hash). CI builds the gateway and runs the patch tests.$note"
          fi
          # Pull requests opened with GITHUB_TOKEN start no workflows; a
          # dispatch does, so run CI on the release branch explicitly.
          gh workflow run ci.yml --ref "release-$v"
          if [ -n "$FAILED" ]; then
            echo "::error::OpenClaw $v: $FAILED failed; draft pull request opened"
            exit 1
          fi
          if [ "$picker" = false ]; then
            echo "::warning::OpenClaw $v builds with the stock session icon picker; re-port: ${issue:-see the issues labelled stock-icon-picker}"
          fi
      - name: Open the pull request of a pushed release branch
        if: steps.latest.outputs.orphan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.latest.outputs.latest }}
          gh pr create --draft --head "release-$v" --title "openclaw: $v" \
            --body "release-$v was pushed without a pull request. Check that it pins the whole release, then mark it ready."
          gh workflow run ci.yml --ref "release-$v"
      # A release pull request still open when main moves would merge an old
      # base (2026.10.3's branch predated a main commit and was rebased by
      # hand). Rebase the watcher's own commit and rerun CI; leave a branch
      # anyone has added to alone.
      - name: Keep an open release branch on main
        if: steps.latest.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=release-${{ steps.latest.outputs.latest }}
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main "$b"
          if git merge-base --is-ancestor origin/main "origin/$b"; then
            echo "$b is on main"; exit 0
          fi
          if [ "$(git rev-list --count "origin/main..origin/$b")" != 1 ] || [ "$(git log -1 --format=%ae "origin/$b")" != "$bot" ]; then
            echo "$b has commits besides the watcher's; not rebasing"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "$bot"
          git switch -c "$b" "origin/$b"
          git rebase origin/main
          git push --force-with-lease="$b:$(git rev-parse "origin/$b")" origin "$b"
          gh workflow run ci.yml --ref "$b"
