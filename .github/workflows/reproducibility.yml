name: reproducibility

# Rebuilds the gateway from source and compares it, bit for bit, with the build the
# cache serves: `nix build --rebuild` fails when an output differs, and the job then
# lists the files that differ. It always publishes the cached build's per-file hashes
# (scripts/file-hashes.sh), so a host that compiled its own can find what differs
# without downloading the NAR. Weekly and by hand; not a required check.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - name: Fetch the cached build and hash its files
        run: |
          out=$(nix build -L --no-link --print-out-paths .#gateway)
          echo "OUT=$out" >> "$GITHUB_ENV"
          mkdir -p hashes
          scripts/file-hashes.sh "$out" > hashes/cached.txt
          nix path-info --json --json-format 1 "$out" | jq -r '.[].narHash' > hashes/cached.narHash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-file-hashes-cached
          path: hashes/
      - name: Rebuild it from source and compare
        run: |
          if nix build -L --rebuild --keep-failed --max-jobs 1 .#gateway; then
            echo "rebuilt bit for bit: $OUT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -d "$OUT.check" ] || exit 1
          scripts/file-hashes.sh "$OUT.check" > hashes/rebuilt.txt
          {
            echo "## The rebuild differs from the cached build"
            echo
            echo '```'
            diff hashes/cached.txt hashes/rebuilt.txt | head -100
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Both copies of the smallest differing files, paired by name with Vite's
          # content hash ignored, to read what differs.
          python3 -I scripts/sample-differences.py "$OUT" "$OUT.check" hashes/cached.txt hashes/rebuilt.txt hashes/samples
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gateway-file-hashes-rebuilt
          path: hashes/
