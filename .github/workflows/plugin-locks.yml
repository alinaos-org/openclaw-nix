name: plugin-locks

# Regenerate a release's generated pins on a branch, commit them there and run CI
# on it: pins/runtime-plugin-locks (every runtime plugin OpenClaw's catalogs list)
# and pins/openclaw-config-options.nix (the typed config options, from the
# release's schema). The generators download every plugin, several dependency
# trees and the release's source dependencies: minutes here, hours on a slow link.
# release-watch does the same for each new release; this is for a branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenClaw release (default release.nix current)
        required: false

permissions:
  actions: write
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Generate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          v=${VERSION:-$(nix eval --raw -f release.nix current)}
          scripts/generate-plugin-locks.sh "$v" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/generate-config-options.sh "$v" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Commit and run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A pins/runtime-plugin-locks pins/openclaw-config-options.nix
          if git diff --cached --quiet; then
            echo "Lock set already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release pins: every runtime plugin and the typed config options at OpenClaw $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # A push made with GITHUB_TOKEN starts no workflows; a dispatch does.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
