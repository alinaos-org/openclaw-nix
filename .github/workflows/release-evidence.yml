name: release-evidence

# SBOMs, a vulnerability scan and a store-path manifest for a release tag
# (scripts/release-evidence.sh), attached to its GitHub release with a build-provenance
# attestation. tag-release calls this after it publishes a release: a release made with
# the workflow token triggers no other workflow. Dispatch it to backfill a tag. A pull
# request that changes the evidence runs it without publishing and keeps the files as
# an artifact.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 2026.10.3-r1
        required: true
  pull_request:
    paths:
      - .github/workflows/release-evidence.yml
      - scripts/release-evidence.sh

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the files to the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # This revision's script; the release itself is checked out below, so a tag cut
      # before the script existed can be backfilled.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: inputs.tag != ''
        with:
          ref: ${{ inputs.tag }}
          path: release
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - name: SBOMs, vulnerability scan and store-path manifest
        env:
          # A pull request describes its own merge commit.
          RELEASE: ${{ inputs.tag != '' && 'release' || '.' }}
        run: |
          scripts/release-evidence.sh evidence "$RELEASE"
          cat evidence/vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: evidence/
      - name: Attest the manifest and the SBOMs
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            evidence/store-paths.json
            evidence/gateway-npm.cdx.json
            evidence/gateway-npm.spdx.json
            evidence/gateway-nix.cdx.json
            evidence/gateway-nix.spdx.json
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" evidence/*.json evidence/vulnerabilities.md --clobber --repo "$REPO"
