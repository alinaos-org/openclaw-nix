name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The Nix version consumers build with, so derivations and the cache match.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      # Not `nix flake check --no-build`: it evaluates read-only, so a source
      # copy the CLI tool bundle needs is never added to a fresh store.
      - name: Evaluate every package and check
        run: |
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)'
      - name: Formatting
        run: nix build -L .#checks.x86_64-linux.formatting

  build:
    needs: eval
    # A larger runner (repository variable BUILD_RUNNER, for example a 16-core
    # one) roughly halves the source build; the default 4-core runner works.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The Nix version consumers build with, so derivations and the cache match.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      # Pull requests from forks get no cache token.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only the dependency set is pushed (below): its store path depends on
          # its hash alone, so every consumer reuses it, even one that applies
          # its own source patches and so compiles its own gateway.
          skipPush: true
      - name: Gateway, hotfix layer, CLI and runtime plugins
        run: nix build -L --max-jobs 1 .#gateway-hotfixed .#openclaw .#runtime-plugins
      - name: Single release and state fence
        run: nix build -L .#checks.x86_64-linux.single-release .#checks.x86_64-linux.state-fence
      # A release pull request pushes it too, so consumers can fetch the new
      # dependency set while the pull request is still under review.
      - name: Push the dependency set to the cache
        if: vars.CACHIX_CACHE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: cachix push "$CACHIX_CACHE" "$(nix eval --raw .#gateway.pnpmDeps.outPath)"
