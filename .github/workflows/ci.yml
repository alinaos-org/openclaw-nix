name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The Nix version consumers build with, so derivations and the cache match.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      # Not `nix flake check --no-build`: it evaluates read-only, so a source
      # copy the CLI tool bundle needs is never added to a fresh store.
      - name: Evaluate every package and check
        run: |
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)'
      - name: Formatting
        run: nix build -L .#checks.x86_64-linux.formatting
      # init generates a laptop flake as a teammate's machine would, and its whole
      # NixOS system evaluates against this checkout (both sign-in modes).
      - name: A generated laptop flake evaluates
        run: tests/starter/eval-generated.sh

  build:
    needs: eval
    # A larger runner (repository variable BUILD_RUNNER, for example a 16-core
    # one) roughly halves the source build; the default 4-core runner works.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The Nix version consumers build with, so derivations and the cache match.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      # Pull requests from forks get no cache token.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only what consumers reuse is pushed (below), not every build output.
          skipPush: true
      - name: Gateway, hotfix layer, CLI and runtime plugins
        run: nix build -L --max-jobs 1 .#gateway-hotfixed .#openclaw .#runtime-plugins
      - name: Single release, state fence, customize layer and upgrade skill
        run: nix build -L .#checks.x86_64-linux.single-release .#checks.x86_64-linux.state-fence .#checks.x86_64-linux.customize .#checks.x86_64-linux.upgrade-skill
      - name: Config overlay (engine, prepare-config, fold, Home Manager module)
        run: nix build -L .#checks.x86_64-linux.config-overlay .#checks.x86_64-linux.config-overlay-prepare .#checks.x86_64-linux.config-overlay-fold .#checks.x86_64-linux.config-overlay-home-manager
      # The source build, for consumers with `sharedBuild`, and its pnpm
      # dependency set, whose store path depends on its hash alone, so even a
      # consumer that compiles its own gateway reuses it. A release pull
      # request pushes them too, so they are cached while it is under review.
      - name: Push the source build and its dependency set to the cache
        if: vars.CACHIX_CACHE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: cachix push "$CACHIX_CACHE" "$(nix eval --raw .#gateway.pnpmDeps.outPath)" "$(nix eval --raw .#gateway.outPath)"

  # The NixOS and workstation modules and the starter laptop in VMs
  # (checks.nixos-module, checks.workstation, checks.starter). Not a required check until it
  # has proven stable on hosted runners.
  nixos-module:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - name: NixOS module VM test
        run: nix build -L .#checks.x86_64-linux.nixos-module
      - name: Workstation module VM test
        run: nix build -L .#checks.x86_64-linux.workstation
      - name: Starter laptop VM test
        run: nix build -L .#checks.x86_64-linux.starter
