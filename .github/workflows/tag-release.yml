name: tag-release

# Tags what consumers pin. A tag is `<OpenClaw release>-r<N>`: r1 when a
# release pull request moves release.nix's `current`, and the next N, by hand,
# for an openclaw-nix fix on the same OpenClaw release. The gateway package
# keeps its own build revision (`-nix.N`), which only changes when the gateway
# does.
on:
  push:
    branches: [main]
    paths: [release.nix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Tag and publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          current=$(nix eval --raw -f release.nix current)
          if git tag --points-at HEAD | grep -q .; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"
            exit 0
          fi
          last=$(git tag --list "$current-r*" | sed "s/^$current-r//" | sort -n | tail -1)
          if [ "$EVENT" = push ] && [ -n "$last" ]; then
            echo "$current is already released as $current-r$last; dispatch this workflow for a fix release"
            exit 0
          fi
          tag="$current-r$(( ${last:-0} + 1 ))"
          previous=$(git tag --list '*-r*' --sort=-creatordate | head -1)
          gateway=$(basename "$(nix eval --raw .#gateway.outPath)")
          cat > notes.md <<NOTES
          Builds [OpenClaw $current](https://github.com/openclaw/openclaw/releases/tag/v$current); gateway \`$gateway\`.

          Pin it with \`openclaw-nix.url = "github:$REPO/$tag";\`. CI cached the gateway in the Cachix cache \`$CACHIX_CACHE\`; the README gives its public key and how to build without it.

          The release-evidence job attaches SBOMs (npm tree and Nix closure), a vulnerability scan and \`store-paths.json\`, with a build-provenance attestation: \`gh attestation verify store-paths.json --repo $REPO\`.
          NOTES
          # A release with OpenClaw's own session icon picker (releases.nix
          # `sessionIconPicker = false;`) says so in its title and notes; the fix
          # release after it that brings the picker back says that.
          picker=$(nix eval --json .#gateway.passthru.sessionIconPicker)
          stock=""
          if [ "$picker" = false ]; then
            stock=" (stock session icon picker)"
            cat >> notes.md <<NOTES

          The Control UI has OpenClaw's own session icon picker in this release: openclaw-nix's picker patch (every emoji, the icon library) is off for $current until it is re-ported (issues labelled \`stock-icon-picker\`). Sessions keep their saved icons and still show them.
          NOTES
          elif [ -n "$last" ] && git show "$current-r$last:releases.nix" > previous-releases.nix &&
            [ "$(nix eval --json --file previous-releases.nix --apply "r: r.\"$current\".sessionIconPicker or true")" = false ]; then
            cat >> notes.md <<NOTES

          The session icon picker is back: $current-r$last had OpenClaw's own picker, and this release has openclaw-nix's again (every emoji, the icon library).
          NOTES
          fi
          git tag "$tag" HEAD
          git push origin "$tag"
          if [ -n "$previous" ]; then
            gh release create "$tag" --title "$tag$stock" --verify-tag --notes-file notes.md --generate-notes --notes-start-tag "$previous"
          else
            gh release create "$tag" --title "$tag$stock" --verify-tag --notes-file notes.md --generate-notes
          fi
          echo "released $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  evidence:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-evidence.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
