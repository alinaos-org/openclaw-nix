# Who can decrypt secrets/*.yaml: this machine (its SSH host key, as an age
# recipient) and you (your own age key, ~/.config/sops/age/keys.txt). To add a
# recipient, list it here, then run `sops updatekeys secrets/openclaw.yaml`.
keys:
  - &host @HOST_AGE_RECIPIENT@
  - &user @USER_AGE_RECIPIENT@
creation_rules:
  - path_regex: ^secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *host
          - *user
